<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta Patrimonial | CRCAL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--azul:#00417D;--escuro:#283656;--ouro:#B29448;--fundo:#F5F7FA}
*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;background:var(--fundo);color:#17212b}
header{background:#fff;padding:20px;border-bottom:3px solid var(--ouro)}.head{max-width:850px;margin:auto;display:flex;align-items:center;gap:16px}
.logo{width:70px;height:70px;object-fit:contain}h1{font-size:21px;color:var(--azul);margin:0 0 5px}.sub{color:#657383;font-size:12px;margin:3px 0}
main{max-width:850px;margin:30px auto;padding:0 16px}.panel{background:#fff;padding:25px;border-radius:12px;box-shadow:0 3px 14px #14283d12}
.eyebrow{font-size:12px;color:var(--ouro);font-weight:bold;letter-spacing:.5px}h2{color:var(--azul);margin:8px 0 16px;font-size:22px}
.number{font-size:30px;color:var(--azul);font-weight:bold;margin:16px 0}
.row{padding:14px 0;border-bottom:1px solid #e8edf2}.row strong{display:block;color:var(--azul);font-size:12px;margin-bottom:6px}.row span{font-size:15px;overflow-wrap:anywhere}
.status{display:inline-block;background:#e8f3eb;color:#22683a;border-radius:5px;padding:6px 10px;font-weight:bold}
.message{color:#657383;line-height:1.6}.error{color:#a51b18}footer{text-align:center;color:#84909d;font-size:11px;padding:20px}
@media(max-width:600px){.head{align-items:flex-start}.logo{width:55px;height:55px}h1{font-size:18px}.panel{padding:19px}}
</style></head>
<body>
<header><div class="head"><img class="logo" src="https://alvaladexxi.github.io/patrimonio-crcal/logo-crcal.jpg" alt="CRCAL"><div><h1>CONSULTA PATRIMONIAL</h1><p class="sub">Conselho Regional de Contabilidade de Alagoas</p><p class="sub">Identificação de bens patrimoniais</p></div></div></header>
<main><section class="panel"><div class="eyebrow">CRCAL | CONSULTA PÚBLICA</div><h2>Identificação do bem</h2><div id="details" class="message">Carregando informações...</div></section></main>
<footer>Conselho Regional de Contabilidade de Alagoas</footer>
<script>
const SUPABASE_URL='https://zgjzqusqssytxqcsykst.supabase.co';
const SUPABASE_KEY='sb_publishable_oQQaUnbIwBzmDh4HPbu4Eg_UYV1tUvJ';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const host=document.getElementById('details');
function field(label,value){if(value===null||value===undefined||String(value).trim()==='')return;const row=document.createElement('div');row.className='row';const strong=document.createElement('strong');strong.textContent=label;const span=document.createElement('span');span.textContent=value;row.append(strong,span);host.append(row)}
async function consultar(){
 const id=new URLSearchParams(location.search).get('id');
 if(!id){host.textContent='Para consultar um bem, utilize a câmera do celular para escanear o QR Code da etiqueta patrimonial.';return}
 try{
  const {data,error}=await db.from('bens_patrimoniais').select('patrimonio,descricao,localizacao,marca_modelo,situacao').eq('patrimonio',id).maybeSingle();
  host.replaceChildren();
  if(error)throw error;
  if(!data){host.textContent='Bem não localizado na base patrimonial. Verifique o número informado ou entre em contato com o CRCAL.';return}
  const number=document.createElement('div');number.className='number';number.textContent='Nº '+data.patrimonio;host.append(number);
  field('Descrição',data.descricao);field('Localização',data.localizacao);field('Marca / modelo',data.marca_modelo);
  const row=document.createElement('div');row.className='row';const strong=document.createElement('strong');strong.textContent='Situação';
  const span=document.createElement('span');span.className='status';span.textContent=data.situacao||'Não informada';row.append(strong,span);host.append(row);
  const note=document.createElement('p');note.className='message';note.textContent='Informações disponibilizadas para consulta patrimonial.';host.append(note);
 }catch(err){host.replaceChildren();const p=document.createElement('p');p.className='message error';p.textContent='Não foi possível consultar este bem no momento. Tente novamente mais tarde.';host.append(p);console.error(err)}
}
consultar();
</script></body></html>
