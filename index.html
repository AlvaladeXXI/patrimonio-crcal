<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patrimônio | CRCAL</title>
<style>
:root{--azul:#00417D;--fundo:#F5F7FA}*{box-sizing:border-box}body{margin:0;font:16px Arial,sans-serif;background:var(--fundo);color:#17212b}header{background:var(--azul);color:white;padding:22px}header div,main{max-width:760px;margin:auto}main{padding:28px 16px}.card{background:white;border-radius:14px;padding:24px;box-shadow:0 4px 18px #14283d12}.muted{color:#657383;font-size:12px;font-weight:bold;letter-spacing:1px}.num{font-size:34px;font-weight:800;color:var(--azul);margin:10px 0}h1{color:var(--azul);font-size:25px}.field{padding:14px 0;border-top:1px solid #e8edf2}dt{font-size:12px;color:#657383;font-weight:bold;text-transform:uppercase;margin-bottom:6px}dd{margin:0}footer{text-align:center;color:#657383;font-size:12px;padding:24px}.status{display:inline-block;background:#e8f5ed;color:#17683a;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:bold}.error h1{color:#b42318}
</style></head><body><header><div><b>CRCAL | PATRIMÔNIO</b><div style="font-size:13px;margin-top:5px">Consulta de identificação patrimonial</div></div></header>
<main><section class="card" id="conteudo" aria-live="polite"><div class="muted">CONSULTA PATRIMONIAL</div><p>Carregando...</p></section><p style="font-size:12px;color:#657383;line-height:1.5">Página destinada à consulta de informações patrimoniais autorizadas para divulgação pública.</p></main><footer>Conselho Regional de Contabilidade de Alagoas</footer>
<script>
(async()=>{const box=document.querySelector('#conteudo'),id=new URLSearchParams(location.search).get('id');function erro(t,m){box.classList.add('error');box.innerHTML='';let h=document.createElement('h1'),p=document.createElement('p');h.textContent=t;p.textContent=m;box.append(h,p)}if(!id){erro('Patrimônio não informado','Leia o QR Code da etiqueta para consultar um bem.');return}try{let r=await fetch('./bens.json?'+Date.now());if(!r.ok)throw 0;let bens=await r.json(),b=bens.find(x=>String(x.patrimonio)===id);if(!b){erro('Bem não localizado','O número '+id+' não consta na base pública.');return}box.innerHTML='';let e=document.createElement('div');e.className='muted';e.textContent='NÚMERO PATRIMONIAL';let n=document.createElement('div');n.className='num';n.textContent=b.patrimonio;let h=document.createElement('h1');h.textContent=b.descricao||'Bem patrimonial';let s=document.createElement('span');s.className='status';s.textContent=b.situacao||'Cadastrado';box.append(e,n,h,s);let dl=document.createElement('dl');[['Localização',b.localizacao],['Marca / modelo',b.marca_modelo],['Responsável / setor',b.responsavel],['Observação',b.observacao]].forEach(([k,v])=>{if(!v)return;let d=document.createElement('div');d.className='field';let dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v;d.append(dt,dd);dl.append(d)});box.append(dl)}catch(e){erro('Erro na consulta','Não foi possível carregar a base patrimonial. Tente novamente mais tarde.')}})();
</script></body></html>
